<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>Elim International Ministries</title>
<style>
:root{--navy:#14213d;--navy2:#1d2f55;--gold:#c9973a;--cream:#faf6ee;--ink:#1c2233;--mut:#6b7385;--line:#e6dfd0;--ok:#2f7d5b;--warn:#b7791f;--bad:#b3423a}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--cream);color:var(--ink);font-size:16px}
button,input,select,textarea{font:inherit}
.sans,button,input,select,textarea,nav,.tag,label{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header .logo{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:18px}
header h1{font-size:16px;margin:0;line-height:1.15}
header small{color:#cdd3e2;font-family:system-ui;font-size:12px}
header .sp{flex:1}
header button{background:transparent;border:1px solid #5a6a90;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 16px 90px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:5}
nav button{flex:1;min-width:76px;background:none;border:0;padding:10px 6px 9px;font-size:12px;color:var(--mut);cursor:pointer;border-top:3px solid transparent}
nav button .i{display:block;font-size:19px;margin-bottom:2px}
nav button.on{color:var(--navy);border-top-color:var(--gold);font-weight:600}
h2{font-size:22px;margin:6px 0 12px;color:var(--navy)}
h3{font-size:16px;margin:0 0 6px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:20px;margin-bottom:14px}
.hero h2{color:#fff;margin:0 0 6px}.hero p{margin:0;color:#dbe0ee}
.verse{font-style:italic;border-left:3px solid var(--gold);padding-left:12px;color:#40485c;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--navy);font-family:system-ui}
.stat span{font-size:12px;color:var(--mut);font-family:system-ui}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d3cbb8;border-radius:8px;background:#fff;color:var(--ink);font-size:15px}
textarea{min-height:80px;resize:vertical}
.btn{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-size:15px;margin-top:12px}
.btn.gold{background:var(--gold);color:var(--navy);font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px;margin:6px 6px 0 0}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.row{display:flex;gap:10px}.row>*{flex:1}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#eee;color:#444;text-transform:uppercase;letter-spacing:.04em}
.tag.pending,.tag.submitted,.tag.new{background:#fdf0d5;color:var(--warn)}
.tag.approved,.tag.confirmed,.tag.prayed{background:#dff3e8;color:var(--ok)}
.tag.declined,.tag.returned{background:#f8e1de;color:var(--bad)}
.meta{font-size:13px;color:var(--mut);font-family:system-ui}
.empty{text-align:center;color:var(--mut);padding:24px 8px;font-family:system-ui}
.login{max-width:420px;margin:0 auto;padding:28px 16px}
.login .crest{width:70px;height:70px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:32px;font-weight:700;margin:0 auto 10px}
.demo button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.demo button b{color:var(--navy)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{font-size:12.5px;color:var(--mut);background:#fff8e6;border:1px solid #f0e0b0;border-radius:8px;padding:8px 10px;margin-top:14px;font-family:system-ui}
.fb{background:#f6f3ea;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(20,33,61,.08);margin-bottom:18px}
.fhead{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px;display:flex;gap:14px;align-items:center;border-bottom:4px solid var(--gold)}
.fhead img{width:58px;height:62px;border-radius:10px;object-fit:cover;flex:none}
.fhead h2{color:#fff;margin:2px 0;font-size:21px}
.fch{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-family:system-ui}
.fsub{font-size:13px;color:#cdd3e2;font-family:system-ui}
.fbody{padding:6px 16px 18px}
.fsec{margin:20px 0 2px;padding-bottom:5px;border-bottom:2px solid var(--gold);color:var(--navy);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-family:system-ui}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
input:disabled{background:#f3efe4;color:#555}
.rowx{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;margin-top:8px}
.rowp{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;margin-top:10px;padding:10px;background:#faf8f2;border:1px solid var(--line);border-radius:10px}
.rowp .a{grid-column:1/3}.rowp .xbtn{grid-column:3;grid-row:1}
.xbtn{background:#f8e1de;color:var(--bad);border:0;border-radius:8px;font-size:20px;cursor:pointer;height:42px}
.bal{margin-top:10px;background:#faf8f2;border:1px dashed var(--gold);border-radius:10px;padding:10px;text-align:right;font-family:system-ui}
.ptab{width:100%;border-collapse:collapse;margin:8px 0;font-family:system-ui;font-size:14px}
.ptab td{padding:6px 8px;border-bottom:1px solid var(--line)}.ptab td:last-child{color:var(--mut);text-align:right}
@media print{header,nav,.tabs,.btn,textarea,.note{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>

var ROLES={member:'Member',leader:'Department Leader',pastor:'Pastor',commenter:'Reviewer (comments)',senior:'Full reviewer',bishop:'Bishop'};
var S={users:[],plans:[],reports:[],appts:[],prayers:[],rosters:[],news:[],roles:[],me:null,myDoc:null,view:'home'};
function save(){}
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function me(){return S.users.find(function(u){return u.id===S.me})||S.myDoc}
function go(v){S.view=v;save();render()}
function nameOf(id){var u=S.users.find(function(u){return u.id===id});return u?u.name:'Unknown'}
function monthLabel(m){try{return new Date(m+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'})}catch(e){return m}}
function empty(t){return '<div class="empty">'+t+'</div>'}

// ---------- auth & live data (Firebase) ----------
var loginMode='login',PENDING_NAME='',SELF=null,UNSUBS=[],SRC={};
function errMsg(e){var c=(e&&e.code)||'';
  var m={'auth/invalid-credential':'Email or password is not correct.','auth/wrong-password':'Email or password is not correct.','auth/user-not-found':'Email or password is not correct.','auth/invalid-email':'That email address is not valid.','auth/email-already-in-use':'That email is already registered. Try signing in.','auth/weak-password':'Password must be at least 6 characters.','auth/too-many-requests':'Too many tries. Please wait a few minutes.','auth/network-request-failed':'No internet connection.','auth/missing-password':'Enter your password.','permission-denied':'You do not have permission to do that.'};
  return m[c]||('Something went wrong ('+(c||(e&&e.message)||'error')+').')}
function showErr(e){console.error(e);var t=errMsg(e),l=$('#lerr');if(l)l.textContent=t;else alert2(t)}
function put(pr,msg){pr.catch(showErr);if(msg)flash(msg);render()}
function newId(col){return FB.doc(FB.collection(FB.db,col)).id}
function renderSetup(){
  $('#app').innerHTML='<div class="login"><img src="'+LOGO+'" alt="Elim International Ministries logo" style="width:100%;border-radius:14px;margin-bottom:12px"><div class="card"><h3>Almost ready</h3><p>This app is not connected to its database yet. Open <b>SETUP.md</b> and follow the steps to paste your Firebase settings at the top of this file.</p></div></div>';
}
function renderLogin(){
  var login=loginMode==='login';
  $('#app').innerHTML='<div class="login"><img src="'+LOGO+'" alt="Elim International Ministries logo" style="width:100%;border-radius:14px;margin-bottom:12px">'+
  '<p class="meta" style="text-align:center;margin-top:0">Member &amp; Leadership Portal</p>'+
  '<div class="tabs"><button class="'+(login?'on':'')+'" onclick="loginMode=\'login\';renderLogin()">Sign in</button><button class="'+(!login?'on':'')+'" onclick="loginMode=\'reg\';renderLogin()">Join as member</button></div>'+
  '<div class="card">'+(login?
   '<label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><button class="btn gold" style="width:100%" onclick="doLogin()">Sign in</button><p style="text-align:center;margin:12px 0 0"><a href="#" class="meta" onclick="doReset();return false">Forgot password?</a></p>':
   '<label>Full name</label><input id="rn" autocomplete="name"><label>Email</label><input id="re" type="email" autocomplete="username"><label>Choose a password (6+ characters)</label><input id="rp" type="password" autocomplete="new-password"><button class="btn gold" style="width:100%" onclick="doReg()">Create my account</button>')+
  '<p id="lerr" class="meta" style="color:var(--bad);margin:8px 0 0"></p></div></div>';
}
function doLogin(){
  var em=$('#le').value.trim(),pw=$('#lp').value;
  if(!em||!pw){$('#lerr').textContent='Enter your email and password.';return}
  FB.signInWithEmailAndPassword(FB.auth,em,pw).catch(showErr);
}
function doReg(){
  var n=$('#rn').value.trim(),em=$('#re').value.trim(),pw=$('#rp').value;
  if(n.length<2||!em||pw.length<6){$('#lerr').textContent='Enter your name, email and a password of 6+ characters.';return}
  PENDING_NAME=n;FB.createUserWithEmailAndPassword(FB.auth,em,pw).catch(showErr);
}
function doReset(){
  var em=$('#le').value.trim();if(!em){$('#lerr').textContent='Type your email above, then tap Forgot password.';return}
  FB.sendPasswordResetEmail(FB.auth,em).then(function(){$('#lerr').style.color='var(--ok)';$('#lerr').textContent='A reset link was sent to your email.'}).catch(showErr);
}
function logout(){FB.signOut(FB.auth)}
function unsubAll(){UNSUBS.forEach(function(f){try{f()}catch(e){}});UNSUBS=[];SRC={}}
function resetData(){['users','plans','reports','rosters','appts','prayers','news'].forEach(function(k){S[k]=[]})}
function sortC(a){return a.sort(function(x,y){return (x.createdAt||0)-(y.createdAt||0)})}
function watch(q,key,src){UNSUBS.push(FB.onSnapshot(q,function(snap){
  SRC[key+':'+src]=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
  var seen={},out=[];Object.keys(SRC).forEach(function(k){if(k.indexOf(key+':')===0)SRC[k].forEach(function(o){if(!seen[o.id]){seen[o.id]=1;out.push(o)}})});
  S[key]=sortC(out);refresh()},showErr))}
function subscribeAll(u){
  var C=FB.collection,Q=FB.query,W=FB.where,db=FB.db;
  watch(C(db,'users'),'users','all');
  watch(C(db,'news'),'news','all');
  UNSUBS.push(FB.onSnapshot(FB.doc(db,'meta','roles'),function(s){S.roles=(s.exists()&&s.data().list)||[];refresh()},showErr));
  ['plans','reports','rosters'].forEach(function(k){
    if(can(u,'read'))watch(C(db,k),k,'all');else if(u.role==='leader')watch(Q(C(db,k),W('by','==',S.me)),k,'mine');

function startSession(user){

};
function rosterCard(p,review){
  var h='<div class="card"><span class="tag '+p.status+'">'+p.status+'</span> <b>'+esc(p.dept||'Department')+'</b> · Sunday '+esc(p.date)+'<div class="meta">'+esc(p.service)+' · By '+esc(nameOf(p.by))+' · '+p.people.length+' people</div>';
  if(p.people.length)h+='<table class="ptab">'+p.people.map(function(x){var n=typeof x==='string'?x:x.name,r=typeof x==='string'?'':x.role;return '<tr><td>'+esc(n)+'</td><td>'+esc(r)+'</td></tr>'}).join('')+'</table>';
  if(p.file){
    if(/^data:image\//.test(p.file.data))h+='<img src="'+p.file.data+'" alt="Attached form" style="max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:6px">';
    else h+='<a class="btn sm ghost" style="display:inline-block;text-decoration:none" href="'+p.file.data+'" download="'+esc(p.file.name)+'">Download '+esc(p.file.name)+'</a>';
  }
  h+=commentsHtml(p);
  if(review)h+=reviewControls(p,'roster');
  return h+'</div>';
}
function line(l,v){return v?'<p style="margin:6px 0;white-space:pre-line"><b>'+l+':</b> '+esc(v)+'</p>':''}
function itemCard(p,kind,review){
  var body=kind==='plan'?line('Goals',p.goals)+line('Activities',p.acts)+line('Budget',p.budget)+line('Expected attendance',p.exp)+line('Support needed',p.support):
    line('Accomplished',p.done)+line('Attendance',p.att)+line('New people',p.nw)+line('Challenges',p.chal)+line('Income',p.inc)+line('Expenses',p.exp)+line('Next month',p.next);
  var h='<div class="card"><span class="tag '+p.status+'">'+p.status+'</span> <b>'+esc(p.dept||'Department')+'</b> · '+monthLabel(p.month)+'<div class="meta">By '+esc(nameOf(p.by))+'</div>'+body;
  h+=commentsHtml(p);
  if(review)h+=reviewControls(p,kind);
  return h+'</div>';
}
// ---------- permissions ----------
function can(u,a){var r=u.role;
  if(a==='approve')return r==='bishop'||r==='senior';
  if(a==='comment'||a==='viewall')return r==='bishop'||r==='senior'||r==='commenter';
  if(a==='conf')return r==='bishop'||!!u.conf;
  if(a==='read')return r==='bishop'||r==='senior'||r==='commenter'||r==='pastor';
  if(a==='appt')return r==='bishop'||!!u.conf||!!u.book;
  if(a==='admin')return r==='bishop';
  return false}
function commentsHtml(p){
  var h='';(p.comments||[]).forEach(function(c){h+='<div class="fb"><b>'+esc(nameOf(c.by))+'</b> <span class="meta">'+esc(c.date)+'</span><br>'+esc(c.text)+'</div>'});
  if(p.decidedBy&&p.status!=='submitted')h+='<div class="meta" style="margin-top:8px">'+(p.status==='approved'?'Approved':'Returned for changes')+' by <b>'+esc(nameOf(p.decidedBy))+'</b></div>';
  return h;
}
function reviewControls(p,kind){
  var u=me();if(!can(u,'comment'))return '';
  var h='<textarea id="fb_'+p.id+'" placeholder="Write a comment..." style="margin-top:10px;min-height:56px"></textarea><button class="btn sm ghost" onclick="rev(\''+kind+'\',\''+p.id+'\',\'comment\')">Add comment</button>';
  if(can(u,'approve'))h+='<button class="btn sm ok" onclick="rev(\''+kind+'\',\''+p.id+'\',\'approved\')">Approve</button><button class="btn sm bad" onclick="rev(\''+kind+'\',\''+p.id+'\',\'returned\')">Return for changes</button>';
  else h+='<div class="meta" style="margin-top:6px">Your comment goes to the Bishop before the final decision.</div>';
  return h;
}
var revTab='plans';
function revTabs(u){
  var t=[];
  if(can(u,'read'))t.push(['plans','Plans'],['reports','Reports'],['rosters','Sunday teams']);
  if(can(u,'appt'))t.push(['appts','Appointments']);
  if(can(u,'conf')||can(u,'viewall'))t.push(['prayers','Prayer']);
  return t;
}
VIEWS.review=function(u){
  var tabs=revTabs(u);
  if(!tabs.some(function(t){return t[0]===revTab}))revTab=tabs.length?tabs[0][0]:'';
  var h='<h2>Review <button class="btn sm ghost" style="float:right;margin:0" onclick="window.print()">Print</button></h2><div class="tabs" style="overflow-x:auto">'+tabs.map(function(t){return '<button class="'+(revTab===t[0]?'on':'')+'" onclick="revTab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join('')+'</div>';
  if(!tabs.length)return h+empty('Nothing to review.');
  if(!can(u,'conf'))h+='<div class="note" style="margin:0 0 12px">Private prayer requests and appointments addressed to other pastors are not shown to you.</div>';
  if(revTab==='plans'){var l=S.plans.slice().reverse();h+=l.length?l.map(function(p){return itemCard(p,'plan',p.status==='submitted')}).join(''):empty('No action plans yet.')}
  if(revTab==='reports'){var l2=S.reports.slice().reverse();h+=l2.length?l2.map(function(p){return itemCard(p,'report',p.status==='submitted')}).join(''):empty('No reports yet.')}
  if(revTab==='rosters'){var l5=S.rosters.slice().reverse();h+=l5.length?l5.map(function(p){return rosterCard(p,p.status==='submitted')}).join(''):empty('No Sunday team forms yet.')}
  if(revTab==='appts'&&can(u,'appt')){var l3=S.appts.filter(function(a){return u.role==='bishop'||a.to===u.id}).reverse();h+=l3.length?l3.map(function(a){return '<div class="card"><span class="tag '+a.status+'">'+a.status+'</span> <b>'+esc(a.reason)+'</b><div class="meta">'+esc(nameOf(a.by))+' → '+esc(nameOf(a.to))+' · '+esc(a.date)+' '+esc(a.time)+'</div>'+(a.note?'<p>'+esc(a.note)+'</p>':'')+(a.reply?'<div class="fb">'+esc(a.reply)+'</div>':'')+(a.status==='pending'?'<input id="ar_'+a.id+'" placeholder="Message to member (optional)" style="margin-top:8px"><button class="btn sm ok" onclick="apptDo(\''+a.id+'\',\'confirmed\')">Confirm</button><button class="btn sm bad" onclick="apptDo(\''+a.id+'\',\'declined\')">Decline</button>':'')+'</div>'}).join(''):empty('No appointment requests.')}
  if(revTab==='prayers'){var l4=S.prayers.filter(function(a){return can(u,'conf')||!a.priv}).reverse();h+=l4.length?l4.map(function(a){return '<div class="card"><span class="tag '+a.status+'">'+a.status+'</span> '+(a.priv?'<span class="tag">private</span> ':'')+'<span class="meta">'+esc(nameOf(a.by))+' · '+esc(a.date)+'</span><p>'+esc(a.text)+'</p>'+(a.status==='new'&&can(u,'conf')?'<button class="btn sm ok" onclick="prayDone(\''+a.id+'\')">Mark as prayed for</button>':'')+'</div>'}).join(''):empty('No prayer requests.')}
  return h;
};
VIEWS.news=function(){
  return '<h2>Announcements</h2><div class="card"><label>Title</label><input id="nw_t"><label>Message</label><textarea id="nw_b"></textarea><button class="btn gold" onclick="addNews()">Publish to all members</button></div>'+
  S.news.slice().reverse().map(function(n){return '<div class="card"><h3>'+esc(n.title)+'</h3><div class="meta">'+esc(n.date)+'</div><p>'+esc(n.body)+'</p><button class="btn sm ghost" onclick="delNews(\''+n.id+'\')">Remove</button></div>'}).join('');
};
VIEWS.people=function(){
  var h='<h2>People &amp; roles</h2><p class="meta">Assign roles so each person sees the right tools.</p>';
  h+=S.users.map(function(x){return '<div class="card"><b>'+esc(x.name)+'</b><div class="row"><div><label>Role</label><select onchange="setRole(\''+x.id+'\',this.value)">'+Object.keys(ROLES).map(function(r){return '<option value="'+r+'"'+(x.role===r?' selected':'')+'>'+ROLES[r]+'</option>'}).join('')+'</select></div><div><label>Department</label><select onchange="setDept(\''+x.id+'\',this.value)"><option value="">-</option>'+DEPTS.map(function(d){return '<option'+(x.dept===d?' selected':'')+'>'+esc(d)+'</option>'}).join('')+'</select></div></div>'+(x.role==='bishop'?'':'<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto"'+(x.conf?' checked':'')+' onchange="setConf(\''+x.id+'\',this.checked)">Can see confidential pastoral items (appointments, private prayers)</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto"'+(x.book||x.conf?' checked':'')+(x.conf?' disabled':'')+' onchange="setBook(\''+x.id+'\',this.checked)">Members can book appointments with this person</label>')+'</div>'}).join('');
  return h;
};
setTimeout(function(){if(!window.__booted){var a=document.getElementById('app');if(a)a.innerHTML='<div class="login"><p class="empty">Could not load. Check your internet connection and refresh.</p></div>'}},10000);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import * as A from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import * as F from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
try{
  if(window.CONFIGURED){
    const app=initializeApp(window.FIREBASE_CONFIG);
    let db;
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    window.FB=Object.assign({},A,F,{auth:A.getAuth(app),db:db});
  }
}catch(e){console.error(e)}
window.__booted=true;window.boot();
</script>
</body>
</html>
